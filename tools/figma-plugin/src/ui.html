<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
body{margin:0;padding:20px;font:13px Inter,system-ui,sans-serif}
h1{margin:0 0 4px;font-size:18px}p{margin:0 0 18px;opacity:.72;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:1px solid rgba(128,128,128,.35);border-radius:8px;background:transparent;color:inherit;padding:10px;cursor:pointer;text-align:left}
button:hover{background:rgba(128,128,128,.12)}
.primary{grid-column:1/-1;background:#18a0fb;color:white;border:0;text-align:center;font-weight:600}
.footer{margin-top:16px;display:flex;justify-content:flex-end}small{opacity:.6}
</style>
</head>
<body>
<h1>Tradumanga Bubble Studio</h1>
<p>Design system inicial para os balões usados pelo tradutor.</p>
<button class="primary" id="system">Criar os 5 componentes</button>
<div class="grid" style="margin-top:12px">
<button data-kind="dialogue">Dialogue</button><button data-kind="thought">Thought</button>
<button data-kind="shout">Shout</button><button data-kind="whisper">Whisper</button>
<button data-kind="narration">Narration</button>
</div>
<div class="footer"><small>Tradumanga · Bubble System v1</small></div>
<script>
const send = (message) => parent.postMessage({ pluginMessage: message }, '*');
document.getElementById('system').onclick = () => send({ type: 'create-system' });
document.querySelectorAll('[data-kind]').forEach((button) => button.onclick = () => send({ type:'create-bubble', kind:button.dataset.kind }));
</script>
</body>
</html>
