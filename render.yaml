services:
  - type: worker
    name: tradumanga-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: WORKER_ID
        value: tradumanga-worker
      - key: JOB_LEASE_SECONDS
        value: "1800"
      - key: JOB_HEARTBEAT_MS
        value: "60000"
      - key: WORKER_POLL_INTERVAL_MS
        value: "2000"
      - key: GALLERY_DL_METADATA_TIMEOUT_MS
        value: "90000"
      - key: GALLERY_DL_TIMEOUT_MS
        value: "300000"
      - key: WORKER_TMP_DIR
        value: /tmp/tradumanga
